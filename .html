<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f0f4f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    width:380px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}

.login-container h2{
    text-align:center;
    color:#005baa;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.captcha{
    background:#e6e6e6;
    padding:10px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#005baa;
    letter-spacing:5px;
    border-radius:5px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:#005baa;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#004080;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    display:block;
    text-decoration:none;
    color:#005baa;
    margin:8px 0;
}

.links a:hover{
    text-decoration:underline;
}

@media(max-width:500px){

.login-container{
    width:90%;
}

}

</style>

</head>

<body>

<div class="login-container">

<h2>Login Page</h2>

<form>

<label>Username</label>
<input type="text" placeholder="Enter Username" required>

<label>Password</label>
<input type="password" placeholder="Enter Password" required>

<div class="captcha">
A7K9P
</div>

<label>Captcha</label>
<input type="text" placeholder="Enter Captcha" required>

<button type="submit">Login</button>

</form>

<div class="links">

<a href="#">Forgot Username?</a>

<a href="#">Forgot Password?</a>

<a href="#">New User Registration</a>

</div>

</div>

</body>
</html>
