<!DOCTYPE html>
<html>
<head>

<title>Registration Form</title>

<style>

body{
    font-family:Arial;
    background:#e6f2ff;
}

.container{
    width:450px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
}

button:hover{
    background:darkgreen;
}

</style>

</head>

<body>

<div class="container">

<h2 align="center">Registration Form</h2>

<form>

<label>Full Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Password</label>
<input type="password">

<label>Phone Number</label>
<input type="tel">

<label>Gender</label>

<select>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Date of Birth</label>
<input type="date">

<label>Address</label>
<input type="text">

<button>Register</button>

</form>

</div>

</body>
</html>
